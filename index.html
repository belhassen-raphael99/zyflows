<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Zyflows" />
  <meta name="robots" content="index, follow" />

  <!-- Static OG/Twitter (per-page values injected by React Helmet) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Zyflows" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Schema.org — Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Zyflows",
    "url": "https://zyflows.com",
    "logo": "https://zyflows.com/assets/logo-z-C5e956L7.png",
    "description": "סוכנות אוטומציה AI המתמחה בבניית מערכות חכמות לעסקים בישראל",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "רעננה",
      "addressCountry": "IL"
    },
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+972-58-422-9255",
      "contactType": "customer service",
      "availableLanguage": ["Hebrew", "French", "English"]
    },
    "sameAs": []
  }
  </script>

  <!-- Schema.org — LocalBusiness -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "Zyflows",
    "url": "https://zyflows.com",
    "telephone": "+972-58-422-9255",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "רעננה",
      "addressRegion": "מרכז",
      "addressCountry": "IL"
    },
    "priceRange": "$$",
    "openingHours": "Mo-Fr 09:00-18:00",
    "serviceArea": {
      "@type": "Country",
      "name": "Israel"
    }
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
